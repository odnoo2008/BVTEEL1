<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нэвтрэх - EduCampus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script> tailwind.config = { theme: { extend: { fontFamily: { display: ['Space Grotesk', 'sans-serif'], body: ['JetBrains Mono', 'sans-serif'], } } } } </script>
  <style>
    :root { --bg: #0A0F1A; --bg-alt: #111827; --bg-card: #151D2E; --fg: #F1F5F9; --fg-muted: #94A3B8; --accent: #F59E0B; --border: #1E293B; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--fg); min-height: 100vh; }
    h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
    .bg-grid { background-image: linear-gradient(rgba(245, 158, 11, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(245, 158, 11, 0.03) 1px, transparent 1px); background-size: 60px 60px; }
    .input { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-alt); color: var(--fg); font-family: inherit; font-size: 14px; transition: all 0.2s ease; }
    .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }
    .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent) 0%, #FBBF24 100%); color: #0A0F1A; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.3s ease; font-family: 'Space Grotesk', sans-serif; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
    
    /* Цонхны анимаци */
    .modal-overlay { transition: opacity 0.3s ease; }
    .modal-content { transition: transform 0.3s ease, opacity 0.3s ease; }
    .hidden-modal { opacity: 0; pointer-events: none; }
    .hidden-modal .modal-content { transform: scale(0.95); opacity: 0; }
  </style>
</head>
<body class="bg-grid">

  <!-- Header -->
  <header class="w-full p-6 border-b border-[#1E293B]">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#F59E0B] to-[#FBBF24] flex items-center justify-center">
          <svg class="w-5 h-5 text-[#0A0F1A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <span class="text-lg font-bold font-['Space_Grotesk']">EduCampus</span>
      </a>
      <div class="flex items-center gap-4">
        <span class="text-sm text-[#94A3B8] hidden sm:block">Бүртгэлгүй юу?</span>
        <a href="./bvrtgvlh.html" class="px-4 py-2 border border-[#1E293B] rounded-lg text-sm font-medium hover:border-[#F59E0B] transition-colors">Бүртгүүлэх</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="py-12 px-6">
    <div class="max-w-xl mx-auto animate-fade-in">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold mb-2">Нэвтрэх</h1>
        <p class="text-[#94A3B8]">Хэрэглэгчийн бүртгэлдээ нэвтрэх</p>
      </div>

      <div class="p-8 rounded-2xl border border-[#1E293B] bg-[#151D2E]">
        <form id="loginForm" class="space-y-5">
          
          <div>
            <label class="block text-sm font-medium mb-2 text-[#94A3B8]">Имэйл</label>
            <input type="email" id="loginEmail" class="input" placeholder="email@example.com" required>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-sm font-medium text-[#94A3B8]">Нууц үг</label>
              <a href="#" class="text-xs text-[#F59E0B] hover:underline">Нууц үг мартсан?</a>
            </div>
            <input type="password" id="loginPassword" class="input" placeholder="Нууц үг" required>
          </div>

          <div class="flex items-center gap-3">
            <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded bg-[#111827] border-[#1E293B] focus:ring-[#F59E0B]">
            <label for="rememberMe" class="text-xs text-[#94A3B8] cursor-pointer">Намайг сана</label>
          </div>

          <button type="submit" class="btn-primary mt-4">Нэвтрэх</button>

        </form>
        
        <!-- Админ нэвтрэх тест мэдээлэл -->
        <div class="mt-6 p-3 bg-[#0A0F1A] rounded-lg border border-[#1E293B] text-center">
          <p class="text-[10px] text-[#94A3B8]">Админ нэвтрэх: admin@educampus.mn / admin123</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Эрх сонгох Цонх (Modal) - Зөвхөн Багш, Сурагчид -->
  <div id="roleModal" class="modal-overlay hidden-modal fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="modal-content w-full max-w-md bg-[#151D2E] border border-[#1E293B] rounded-2xl p-8 text-center">
      <div class="w-16 h-16 mx-auto mb-5 rounded-full bg-[#111827] flex items-center justify-center border border-[#1E293B]">
        <svg class="w-8 h-8 text-[#F59E0B]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      </div>
      <h2 class="text-2xl font-bold mb-2">Амжилттай нэвтэрлээ!</h2>
      <p class="text-[#94A3B8] text-sm mb-8">Та өөрийн эрхээ сонгоно уу</p>
      
      <div class="flex flex-col sm:flex-row gap-4">
        <button onclick="navigateToRole('teacher')" class="flex-1 py-4 px-6 bg-[#111827] border border-[#1E293B] rounded-xl hover:border-[#F59E0B] hover:bg-[#1a2332] transition-all group">
          <svg class="w-8 h-8 mx-auto mb-2 text-[#94A3B8] group-hover:text-[#F59E0B] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
          <span class="font-bold text-lg group-hover:text-[#F59E0B] transition-colors">Багш</span>
        </button>
        <button onclick="navigateToRole('student')" class="flex-1 py-4 px-6 bg-[#111827] border border-[#1E293B] rounded-xl hover:border-[#F59E0B] hover:bg-[#1a2332] transition-all group">
          <svg class="w-8 h-8 mx-auto mb-2 text-[#94A3B8] group-hover:text-[#F59E0B] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          <span class="font-bold text-lg group-hover:text-[#F59E0B] transition-colors">Сурагч</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = this.querySelector('button[type="submit"]');
      
      btn.textContent = 'Шалгаж байна...';
      btn.disabled = true;

      setTimeout(() => {
        
        // --- 1. АДМИН НЭВТРЭХ ТОХИРГОО (Шууд шилжинэ) ---
        const ADMIN_EMAIL = 'admin@educampus.mn';
        const ADMIN_PASSWORD = 'admin123';

        if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
          localStorage.setItem('eduCampusCurrentSession', JSON.stringify({
            email: email,
            role: 'admin'
          }));
          window.location.href = './admin.html';
          return; // Цааш үргэлжлүүлэхгүй
        }

        // --- 2. ЭНГИЙН ХЭРЭГЛЭГЧ (Багш/Сурагч) ---
        const users = JSON.parse(localStorage.getItem('eduCampusUsers')) || {};
        const user = users[email];

        // Хэрэв бүртгэл байхгүй бол
        if (!user) {
          alert('Бүртгэлгүй байна. Та эхлээд бүртгүүлнэ үү!');
          window.location.href = './bvrtgvlh.html'; 
          return;
        }

        // Хэрэв нууц үг буруу бол
        if (user.password !== password) {
          alert('Нууц үг буруу байна!');
          btn.textContent = 'Нэвтрэх';
          btn.disabled = false;
          return;
        }

        // Бүртгэлтэй бөгөөд нууц үг зөв бол - Эрх сонгох цонх гаргах (Админгүй)
        document.getElementById('roleModal').classList.remove('hidden-modal');
        
        btn.textContent = 'Нэвтрэх';
        btn.disabled = false;

      }, 800);
    });

    // Эрхээ сонгож хуудас руу шилжих функц (Зөвхөн Багш, Сурагч)
    function navigateToRole(role) {
      localStorage.setItem('eduCampusCurrentSession', JSON.stringify({
        email: document.getElementById('loginEmail').value.trim(),
        role: role
      }));

      document.getElementById('roleModal').classList.add('hidden-modal');
      
      if(role === 'teacher') {
        window.location.href = './teacher.html';
      } else if(role === 'student') {
        window.location.href = './student.html';
      }
    }
  </script>
</body>
</html>
